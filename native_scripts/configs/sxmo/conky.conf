-- Sxmo X11 conky config for Lenovo A2010 (480x854)
conky.config = {
    out_to_x = true,
    out_to_wayland = false,
    own_window = true,
    own_window_type = 'override',
    own_window_transparent = true,
    own_window_argb_visual = true,
    own_window_argb_value = 0,
    alignment = 'middle_middle',
    font = 'Sxmo:size=14',
    use_xft = true,
    draw_shades = true,
    default_shade_color = 'black',
    update_interval = 5,
}

conky.text = [[
${alignc}${font Sxmo:size=54:style=Bold}${exec date +"%H:%M"}${font}

${alignc}${font Sxmo:size=18}${exec date +"%a, %d %b"}${font}
]]
